<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Class Whiteboard</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; background: #0f172a; color: #f8fafc; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    .btn-ghost { background: transparent; color: #94a3b8; border: 1px solid #334155; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }
    .btn-ghost:hover { color: #f8fafc; border-color: #475569; }

    .card { background: #1e293b; padding: 24px; border-radius: 8px; max-width: 440px; margin: 30px auto; border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3); }
    h2, h3 { margin-top: 0; color: #f8fafc; }
    label { font-size: 0.85rem; font-weight: 600; color: #94a3b8; display: block; margin-top: 14px; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; }
    input:focus { outline: none; border-color: #38bdf8; }

    button { padding: 10px 16px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; font-size: 0.95rem; }
    .btn-primary { width: 100%; background: #2563eb; color: white; margin-top: 16px; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #334155; color: #f8fafc; }
    .btn-secondary:hover { background: #475569; }
    .btn-danger { background: #dc2626; color: white; }
    .btn-amber { background: #d97706; color: white; }

    /* Student Canvas */
    #student-draw-view { display: none; max-width: 500px; margin: 0 auto; }
    .board-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .canvas-container { position: relative; width: 100%; height: 340px; }
    canvas { border: 2px solid #475569; border-radius: 8px; background: #ffffff; touch-action: none; display: block; width: 100%; height: 100%; cursor: crosshair; }
    
    /* Lock Overlay */
    .lock-overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.85); border-radius: 8px; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10; color: white; text-align: center; padding: 20px; }
    .lock-overlay span { font-size: 2.5rem; margin-bottom: 8px; }
    
    .canvas-actions { margin-top: 12px; display: flex; gap: 10px; }
    .canvas-actions button { flex: 1; }

    /* Countdown Pill */
    .timer-pill { background: #d97706; color: white; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; display: none; }

    /* Teacher View */
    #teacher-view { display: none; max-width: 1200px; margin: 0 auto; }
    .teacher-nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 16px; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    .room-badge { background: #0284c7; color: white; padding: 6px 12px; border-radius: 6px; font-weight: 700; }
    
    /* Teacher Action Bar */
    .action-toolbar { background: #1e293b; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; border: 1px solid #334155; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .action-toolbar label { margin: 0; }
    .timer-input { width: 90px; padding: 8px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 0.95rem; }

    /* Roster */
    .roster-panel { background: #1e293b; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; border: 1px solid #334155; }
    .roster-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: bold; margin-bottom: 8px; color: #94a3b8; }
    .roster-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .student-chip { background: #0f172a; border: 1px solid #38bdf8; color: #f8fafc; padding: 4px 10px; border-radius: 16px; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; display: inline-block; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .board-card { background: #1e293b; border-radius: 8px; overflow: hidden; border: 1px solid #334155; display: flex; flex-direction: column; }
    .board-card img { width: 100%; height: 190px; object-fit: contain; background: #ffffff; border-bottom: 1px solid #334155; }
    .board-placeholder { width: 100%; height: 190px; display: flex; align-items: center; justify-content: center; background: #0f172a; color: #64748b; font-size: 0.85rem; font-style: italic; border-bottom: 1px solid #334155; }
    .board-meta { padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
    .seat-tag { font-weight: 600; color: #38bdf8; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); align-items: center; justify-content: center; z-index: 100; }
  </style>
</head>
<body>

  <div class="top-bar">
    <span style="font-weight: 700; color: #38bdf8;">Classroom LiveBoard</span>
    <button class="btn-ghost" id="teacher-switch-btn" onclick="openTeacherLogin()">Teacher Admin</button>
  </div>

  <!-- 1. ENTRY SCREEN -->
  <div id="join-view" class="card">
    <h2>Join Session</h2>
    <label>Room Number</label>
    <input type="text" id="join-room" placeholder="e.g. 234" autocomplete="off">
    <label>Desk / Device Identifier</label>
    <input type="text" id="join-seat" placeholder="e.g. Desk 12" maxlength="12">
    <button class="btn-primary" onclick="joinAsStudent()">Enter Room</button>
  </div>

  <!-- 2. STUDENT CANVAS VIEW -->
  <div id="student-draw-view">
    <div class="board-header">
      <div>
        <strong id="s-display-seat" style="color: #38bdf8;"></strong>
        <span style="color: #94a3b8; font-size: 0.85rem;" id="s-room-tag"></span>
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <span class="timer-pill" id="s-timer-pill">⏱ 00:00</span>
        <span id="s-sync-status" style="color: #22c55e; font-size: 0.85rem;">● Connected</span>
      </div>
    </div>
    
    <div class="canvas-container">
      <canvas id="board"></canvas>
      <div class="lock-overlay" id="s-lock-overlay">
        <span>🔒</span>
        <h3 style="margin: 0 0 6px 0;">Board Locked</h3>
        <p style="margin: 0; font-size: 0.85rem; color: #cbd5e1;">Your teacher has paused writing.</p>
      </div>
    </div>

    <div class="canvas-actions">
      <button class="btn-secondary" id="s-clear-btn" onclick="clearCanvas()">Clear</button>
      <button class="btn-primary" style="margin-top: 0;" id="s-force-btn" onclick="sendBoardImmediate()">Force Send</button>
    </div>
  </div>

  <!-- 3. TEACHER VIEW -->
  <div id="teacher-view">
    <div class="teacher-nav">
      <div>
        <h2 style="margin: 0 0 4px 0;">Teacher Console</h2>
        <span id="sub-counter" style="color: #94a3b8; font-size: 0.85rem;">Currently Connected: 0</span>
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <span class="timer-pill" id="t-timer-pill">⏱ 00:00</span>
        <span class="room-badge" id="t-room-tag">Room: ---</span>
        <button class="btn-danger" onclick="clearTeacherBoards()">Clear Room</button>
      </div>
    </div>

    <!-- Teacher Controls Toolbar -->
    <div class="action-toolbar">
      <button id="lock-toggle-btn" class="btn-amber" onclick="toggleLockState()">🔒 Lock All Boards</button>
      
      <div style="display: flex; align-items: center; gap: 6px; margin-left: auto;">
        <input type="number" id="timer-seconds" class="timer-input" placeholder="Secs" value="60" min="5" max="900">
        <button class="btn-secondary" onclick="startTimer()">⏱ Start Timer</button>
      </div>
    </div>

    <!-- Live Roster -->
    <div class="roster-panel">
      <div class="roster-header">
        <span>Currently Connected Students</span>
        <span id="roster-count" style="color: #38bdf8;">0 connected</span>
      </div>
      <div class="roster-tags" id="roster-tags">
        <span style="color: #64748b; font-size: 0.85rem; font-style: italic;">No students currently connected.</span>
      </div>
    </div>

    <div class="grid" id="teacher-grid"></div>
  </div>

  <!-- TEACHER PIN MODAL -->
  <div class="modal-overlay" id="login-modal">
    <div class="card" style="margin: 0; width: 320px;">
      <h3 style="margin-bottom: 8px;">Teacher Verification</h3>
      <label>Room Number</label>
      <input type="text" id="teacher-target-room" placeholder="e.g. 234">
      <label>PIN</label>
      <input type="password" id="teacher-pin" placeholder="Enter PIN" onkeydown="if(event.key==='Enter') unlockTeacher()">
      <div style="display: flex; gap: 8px; margin-top: 14px;">
        <button class="btn-secondary" style="flex:1;" onclick="closeTeacherLogin()">Cancel</button>
        <button class="btn-primary" style="flex:1; margin-top:0;" onclick="unlockTeacher()">Unlock</button>
      </div>
    </div>
  </div>

  <script>
    const TEACHER_PIN = "1234";

    // PASTE YOUR WORKING CLOUDFLARE WORKER URL HERE:
    const RELAY_URL = "https://class-relay.kerswell-c.workers.dev";

    let activeRoom = "";
    let studentSeat = "";
    let pollInterval = null;
    let streamDebounceTimer = null;
    let isBoardLocked = false;
    let teacherLockFlag = false;

    // Format seconds into MM:SS
    function formatTime(totalSecs) {
      const mins = Math.floor(totalSecs / 60);
      const secs = totalSecs % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // --- STUDENT LOGIC ---
    function joinAsStudent() {
      const room = document.getElementById('join-room').value.trim().replace(/[^a-zA-Z0-9]/g, '');
      const seat = document.getElementById('join-seat').value.trim().replace(/[^a-zA-Z0-9 _-]/g, '');

      if (!room || !seat) return alert("Please enter Room Number and Desk ID.");

      activeRoom = room;
      studentSeat = seat;

      document.getElementById('join-view').style.display = 'none';
      document.getElementById('student-draw-view').style.display = 'block';
      document.getElementById('s-display-seat').innerText = studentSeat;
      document.getElementById('s-room-tag').innerText = ` (Room ${activeRoom})`;

      setupCanvas();

      // Start presence & status sync (every 3 seconds)
      pingRelay();
      setInterval(pingRelay, 3000);

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) pingRelay();
      });
    }

    async function pingRelay() {
      try {
        const res = await fetch(`${RELAY_URL}/${activeRoom}/ping`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ seat: studentSeat })
        });
        if (!res.ok) return;
        const data = await res.json();
        
        // Handle Lock overlay
        updateStudentLockState(data.locked);

        // Handle Countdown timer
        const timerPill = document.getElementById('s-timer-pill');
        if (data.timerRemaining > 0) {
          timerPill.style.display = 'inline-block';
          timerPill.innerText = `⏱ ${formatTime(data.timerRemaining)}`;
        } else {
          timerPill.style.display = 'none';
        }
      } catch (e) {}
    }

    function updateStudentLockState(locked) {
      isBoardLocked = locked;
      const overlay = document.getElementById('s-lock-overlay');
      const clearBtn = document.getElementById('s-clear-btn');
      const forceBtn = document.getElementById('s-force-btn');

      if (locked) {
        overlay.style.display = 'flex';
        clearBtn.disabled = true;
        forceBtn.disabled = true;
      } else {
        overlay.style.display = 'none';
        clearBtn.disabled = false;
        forceBtn.disabled = false;
      }
    }

    function queueAutoSync() {
      if (isBoardLocked) return;
      const statusEl = document.getElementById('s-sync-status');
      statusEl.innerText = "Syncing...";
      statusEl.style.color = "#f59e0b";

      clearTimeout(streamDebounceTimer);
      streamDebounceTimer = setTimeout(async () => {
        await sendBoardPayload();
        statusEl.innerText = "● Connected";
        statusEl.style.color = "#22c55e";
      }, 800);
    }

    function sendBoardImmediate() {
      if (isBoardLocked) return;
      sendBoardPayload();
    }

    async function sendBoardPayload() {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = 320;
      exportCanvas.height = 220;
      const expCtx = exportCanvas.getContext('2d');
      expCtx.fillStyle = '#ffffff';
      expCtx.fillRect(0, 0, 320, 220);
      expCtx.drawImage(canvas, 0, 0, 320, 220);

      const imgData = exportCanvas.toDataURL('image/jpeg', 0.55);

      try {
        await fetch(`${RELAY_URL}/${activeRoom}/submit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ seat: studentSeat, image: imgData })
        });
      } catch (err) {}
    }

    // --- TEACHER LOGIC ---
    function openTeacherLogin() {
      document.getElementById('login-modal').style.display = 'flex';
      const existingRoom = document.getElementById('join-room').value.trim();
      if (existingRoom) document.getElementById('teacher-target-room').value = existingRoom;
      document.getElementById('teacher-pin').focus();
    }

    function closeTeacherLogin() {
      document.getElementById('login-modal').style.display = 'none';
      document.getElementById('teacher-pin').value = '';
    }

    function unlockTeacher() {
      const room = document.getElementById('teacher-target-room').value.trim().replace(/[^a-zA-Z0-9]/g, '');
      const pin = document.getElementById('teacher-pin').value.trim();

      if (!room) return alert("Please enter the Room Number.");
      if (pin !== TEACHER_PIN) return alert("Incorrect PIN.");

      closeTeacherLogin();
      activeRoom = room;

      document.getElementById('join-view').style.display = 'none';
      document.getElementById('student-draw-view').style.display = 'none';
      document.getElementById('teacher-switch-btn').style.display = 'none';
      document.getElementById('teacher-view').style.display = 'block';
      document.getElementById('t-room-tag').innerText = `Room: ${activeRoom}`;

      fetchBoards();
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(fetchBoards, 2000);
    }

    async function toggleLockState() {
      teacherLockFlag = !teacherLockFlag;
      await fetch(`${RELAY_URL}/${activeRoom}/control`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ locked: teacherLockFlag })
      });
      updateLockBtnUI(teacherLockFlag);
    }

    async function startTimer() {
      const secs = parseInt(document.getElementById('timer-seconds').value, 10);
      if (isNaN(secs) || secs <= 0) return alert("Please specify valid seconds.");

      teacherLockFlag = false;
      updateLockBtnUI(false);

      await fetch(`${RELAY_URL}/${activeRoom}/control`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ timerSeconds: secs })
      });
    }

    function updateLockBtnUI(locked) {
      const btn = document.getElementById('lock-toggle-btn');
      if (locked) {
        btn.innerText = "🔓 Unlock All Boards";
        btn.className = "btn-secondary";
      } else {
        btn.innerText = "🔒 Lock All Boards";
        btn.className = "btn-amber";
      }
    }

    async function fetchBoards() {
      try {
        const res = await fetch(`${RELAY_URL}/${activeRoom}/poll`);
        if (!res.ok) return;
        const data = await res.json();
        
        teacherLockFlag = data.locked;
        updateLockBtnUI(data.locked);

        // Update Teacher Timer Display
        const timerPill = document.getElementById('t-timer-pill');
        if (data.timerRemaining > 0) {
          timerPill.style.display = 'inline-block';
          timerPill.innerText = `⏱ ${formatTime(data.timerRemaining)}`;
        } else {
          timerPill.style.display = 'none';
        }

        renderTeacherDashboard(data.students || []);
      } catch (e) {}
    }

    function renderTeacherDashboard(students) {
      document.getElementById('sub-counter').innerText = `Currently Connected: ${students.length}`;
      document.getElementById('roster-count').innerText = `${students.length} connected`;

      // Update Roster Chips
      const rosterEl = document.getElementById('roster-tags');
      if (students.length === 0) {
        rosterEl.innerHTML = `<span style="color: #64748b; font-size: 0.85rem; font-style: italic;">No students currently connected.</span>`;
      } else {
        rosterEl.innerHTML = '';
        students.forEach(s => {
          const chip = document.createElement('div');
          chip.className = 'student-chip';
          chip.innerHTML = `<span class="status-dot"></span><span>${escapeHTML(s.seat)}</span>`;
          rosterEl.appendChild(chip);
        });
      }

      // Update Live Boards
      const grid = document.getElementById('teacher-grid');
      grid.innerHTML = '';

      students.forEach(s => {
        const card = document.createElement('div');
        card.className = 'board-card';

        const boardContent = s.image
          ? `<img src="${s.image}" alt="Board">`
          : `<div class="board-placeholder">Waiting for student to draw...</div>`;

        card.innerHTML = `
          ${boardContent}
          <div class="board-meta">
            <span class="seat-tag">${escapeHTML(s.seat)}</span>
            <span style="color:#22c55e; font-size:0.75rem;">● Connected</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function clearTeacherBoards() {
      if (confirm("Clear all boards in this room?")) {
        await fetch(`${RELAY_URL}/${activeRoom}/clear`, { method: 'DELETE' });
        document.getElementById('teacher-grid').innerHTML = '';
        document.getElementById('roster-tags').innerHTML = '';
        document.getElementById('sub-counter').innerText = 'Currently Connected: 0';
      }
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    // --- CANVAS ENGINE ---
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    let drawing = false;

    function setupCanvas() {
      setTimeout(() => {
        canvas.width = canvas.offsetWidth;
        canvas.height = 340;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#000000';
      }, 50);
    }

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDraw(e) {
      if (isBoardLocked) return;
      drawing = true;
      const { x, y } = getCoords(e);
      ctx.beginPath();
      ctx.moveTo(x, y);
    }

    function stopDraw() {
      if (drawing) {
        drawing = false;
        ctx.beginPath();
        queueAutoSync();
      }
    }

    function draw(e) {
      if (!drawing || isBoardLocked) return;
      e.preventDefault();
      const { x, y } = getCoords(e);
      ctx.lineTo(x, y);
      ctx.stroke();
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchend', stopDraw);
    canvas.addEventListener('touchmove', draw, { passive: false });

    function clearCanvas() {
      if (isBoardLocked) return;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.beginPath();
      queueAutoSync();
    }
  </script>
</body>
</html>
